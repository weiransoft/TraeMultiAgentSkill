<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#201418"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#f87171" flood-opacity="0.2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>
  <circle cx="70" cy="60" r="130" fill="#f87171" opacity="0.05"/>
  <text x="42" y="46" fill="#f87171" font-size="12" letter-spacing="3" font-weight="600">TRAE MULTI-AGENT SKILL · v2.14 特性 4/5</text>
  <text x="42" y="92" fill="#f1f5f9" font-size="30" font-weight="700">收尾四道闸 · 一道不过不放行</text>
  <text x="42" y="121" fill="#94a3b8" font-size="14">finalize 一次核对四个维度 —— 任何"应该没问题"都过不了脚本</text>

  <!-- 输入 → 闸门 → 输出 -->
  <text x="70" y="222" fill="#94a3b8" font-size="13.5" text-anchor="middle">执行记录</text>
  <text x="70" y="242" fill="#64748b" font-size="11.5" text-anchor="middle">cases / 断言</text>
  <line x1="108" y1="225" x2="148" y2="225" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <g filter="url(#sh)">
    <rect x="158" y="152" width="152" height="60" rx="10" fill="#1c2740" stroke="#38bdf8" stroke-width="1.6"/>
    <rect x="326" y="152" width="152" height="60" rx="10" fill="#1c2740" stroke="#34d399" stroke-width="1.6"/>
    <rect x="158" y="238" width="152" height="60" rx="10" fill="#1c2740" stroke="#34d399" stroke-width="1.6"/>
    <rect x="326" y="238" width="152" height="60" rx="10" fill="#1c2740" stroke="#fbbf24" stroke-width="1.6"/>
  </g>
  <g font-size="15.5" font-weight="700" text-anchor="middle">
    <text x="234" y="180" fill="#38bdf8">P0 门禁</text>
    <text x="402" y="180" fill="#34d399">data_gate</text>
    <text x="234" y="266" fill="#34d399">feature_gate</text>
    <text x="402" y="266" fill="#fbbf24">缺陷登记闸</text>
  </g>
  <g font-size="11" fill="#94a3b8" text-anchor="middle">
    <text x="234" y="200">P0 通过率 100%</text>
    <text x="402" y="200">dc/rule 断言 · 只读快照</text>
    <text x="234" y="286">FUNC 矩阵现算 · SHA 锚定</text>
    <text x="402" y="286">suspected_bug 必须成单</text>
  </g>
  <line x1="490" y1="225" x2="536" y2="225" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 结果 -->
  <g filter="url(#sh)">
    <rect x="548" y="185" width="130" height="80" rx="12" fill="#12291f" stroke="#34d399" stroke-width="2"/>
    <rect x="700" y="185" width="160" height="80" rx="12" fill="#2b1418" stroke="#f87171" stroke-width="2"/>
  </g>
  <text x="613" y="222" fill="#34d399" font-size="21" font-weight="800" text-anchor="middle">PASS</text>
  <text x="613" y="246" fill="#64748b" font-size="11" text-anchor="middle">绿灯发布</text>
  <text x="780" y="222" fill="#f87171" font-size="21" font-weight="800" text-anchor="middle">FAIL</text>
  <text x="780" y="246" fill="#64748b" font-size="11" text-anchor="middle">缺口清单逐条可追</text>

  <text x="400" y="326" fill="#64748b" font-size="12.5" text-anchor="middle">闸是"与"关系：P0 全过但漏登一张缺陷工单，整体照样 FAIL</text>

  <rect x="0" y="340" width="900" height="43" fill="#0a0e18"/>
  <text x="42" y="367" fill="#64748b" font-size="12.5">gate（P0/一致性）× data_gate（v2.13）× feature_gate（v2.14）× 登记闸（v2.14） · summary.md 全维度呈现</text>
  <text x="858" y="367" fill="#f87171" font-size="12.5" text-anchor="end">multi-agent-team</text>
</svg>
