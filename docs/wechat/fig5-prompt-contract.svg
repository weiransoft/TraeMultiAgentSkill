<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#151d33"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#fbbf24" flood-opacity="0.2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>
  <circle cx="830" cy="330" r="140" fill="#fbbf24" opacity="0.05"/>
  <text x="42" y="46" fill="#fbbf24" font-size="12" letter-spacing="3" font-weight="600">TRAE MULTI-AGENT SKILL · v2.14 特性 5/5</text>
  <text x="42" y="92" fill="#f1f5f9" font-size="30" font-weight="700">Prompt 契约 × CLI 全清单</text>
  <text x="42" y="121" fill="#94a3b8" font-size="14">角色提示词与脚本实现双向对齐 —— 文档写的每条命令都能跑</text>

  <!-- 三个 prompt 卡 -->
  <g filter="url(#sh)">
    <rect x="42" y="150" width="268" height="118" rx="12" fill="#1c2740" stroke="#334155"/>
    <rect x="316" y="150" width="268" height="118" rx="12" fill="#1c2740" stroke="#334155"/>
    <rect x="590" y="150" width="268" height="118" rx="12" fill="#1c2740" stroke="#334155"/>
  </g>
  <g font-size="14.5" font-weight="700">
    <text x="62" y="180" fill="#38bdf8">planner 规划员</text>
    <text x="336" y="180" fill="#f472b6">review 评审团</text>
    <text x="610" y="180" fill="#34d399">execution 执行员</text>
  </g>
  <g font-size="12" fill="#94a3b8">
    <text x="62" y="206">Step 2.5 每页功能清单 FUNC-*</text>
    <text x="62" y="228">kind 五类覆盖要求表 + JSON 示例</text>
    <text x="62" y="250">interactive/form 100% P0 → BLOCKER</text>
    <text x="336" y="206">FUNC 完备性 + 清单真实性评审</text>
    <text x="336" y="228">一票否决：主路径 或 功能项无 P0</text>
    <text x="336" y="250">SHA256 冻结写入评审记录</text>
    <text x="610" y="206">疑似缺陷登记闭环六步协议</text>
    <text x="610" y="228">功能覆盖预检（SHA 锚定核对）</text>
    <text x="610" y="250">--funcs 归因 + 四闸收尾</text>
  </g>

  <!-- CLI 清单条 -->
  <g filter="url(#sh)">
    <rect x="42" y="284" width="816" height="44" rx="10" fill="#1c2740" stroke="#fbbf24" stroke-opacity="0.5"/>
  </g>
  <text x="62" y="312" fill="#fbbf24" font-size="13.5" font-weight="700">SKILL.md 指令清单</text>
  <text x="220" y="312" fill="#94a3b8" font-size="12.5" font-family="Menlo, monospace">84 dispatcher flags · 13 recorder 子命令 · 5 配套工具 · 示例经 CLI 实测合法</text>

  <rect x="0" y="340" width="900" height="43" fill="#0a0e18"/>
  <text x="42" y="367" fill="#64748b" font-size="12.5">v2.14 修复 3 处文档-实现漂移：路径错误 / 命令名不符 / 产物路径对不上 —— 双向核验，杜绝漂移复发</text>
  <text x="858" y="367" fill="#fbbf24" font-size="12.5" text-anchor="end">multi-agent-team</text>
</svg>
