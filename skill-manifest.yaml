        - 新增覆盖矩阵门禁（feature_gate）：finalize 现算 FUNC × PASS 断言关联矩阵；interactive/form 任一未覆盖 → 整体 gate=FAIL；清单原件 SHA256 锚定写入 run 元数据，执行期篡改清单即 FAIL（防"移动球门"）
