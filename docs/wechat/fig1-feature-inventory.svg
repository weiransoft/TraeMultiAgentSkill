<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#151d33"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#22d3ee" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>
  <!-- 装饰 -->
  <circle cx="835" cy="45" r="140" fill="#22d3ee" opacity="0.05"/>
  <circle cx="835" cy="45" r="90" fill="#22d3ee" opacity="0.05"/>
  <text x="42" y="46" fill="#22d3ee" font-size="12" letter-spacing="3" font-weight="600">TRAE MULTI-AGENT SKILL · v2.14 特性 1/5</text>
  <text x="42" y="92" fill="#f1f5f9" font-size="30" font-weight="700">FUNC-* 每页功能清单</text>
  <text x="42" y="121" fill="#94a3b8" font-size="14">用例全过 ≠ 功能都测到了 —— 清单就是覆盖矩阵的分母</text>

  <!-- 左卡片：FUNC 项示例 -->
  <g filter="url(#sh)">
    <rect x="42" y="150" width="392" height="150" rx="12" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="64" y="182" fill="#e2e8f0" font-size="15" font-weight="600">page-feature-inventory.json</text>
  <rect x="64" y="198" width="118" height="26" rx="13" fill="#38bdf8" opacity="0.16"/>
  <text x="76" y="216" fill="#38bdf8" font-size="12" font-weight="600">interactive</text>
  <text x="196" y="216" fill="#f1f5f9" font-size="13" font-family="Menlo, monospace">FUNC-01-01 提交订单</text>
  <rect x="64" y="234" width="118" height="26" rx="13" fill="#818cf8" opacity="0.16"/>
  <text x="76" y="252" fill="#818cf8" font-size="12" font-weight="600">form</text>
  <text x="196" y="252" fill="#f1f5f9" font-size="13" font-family="Menlo, monospace">FUNC-01-02 地址表单</text>
  <rect x="64" y="270" width="118" height="26" rx="13" fill="#475569" opacity="0.35"/>
  <text x="76" y="288" fill="#94a3b8" font-size="12" font-weight="600">nav · 豁免</text>
  <text x="196" y="288" fill="#64748b" font-size="13" font-family="Menlo, monospace">+ waive_reason</text>
  <text x="64" y="326" fill="#22d3ee" font-size="12.5" font-family="Menlo, monospace">evidence: order.vue:128 ← 强制 文件:行号</text>

  <!-- 右卡片：kind 五类 -->
  <g filter="url(#sh)">
    <rect x="460" y="150" width="398" height="150" rx="12" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="482" y="182" fill="#e2e8f0" font-size="15" font-weight="600">kind 五类 · 覆盖要求</text>
  <g font-size="13.5">
    <circle cx="492" cy="206" r="4" fill="#38bdf8"/><text x="506" y="211" fill="#f1f5f9">interactive 交互 <tspan fill="#f87171" font-weight="600">必须 P0 · 禁止豁免</tspan></text>
    <circle cx="492" cy="234" r="4" fill="#818cf8"/><text x="506" y="239" fill="#f1f5f9">form 表单 <tspan fill="#f87171" font-weight="600">必须 P0 · 禁止豁免</tspan></text>
    <circle cx="492" cy="262" r="4" fill="#34d399"/><text x="506" y="267" fill="#f1f5f9">display 展示 <tspan fill="#94a3b8">覆盖 或 书面豁免</tspan></text>
    <circle cx="492" cy="290" r="4" fill="#fbbf24"/><text x="506" y="295" fill="#f1f5f9">nav 导航 <tspan fill="#94a3b8">覆盖 或 书面豁免</tspan></text>
    <circle cx="740" cy="206" r="4" fill="#f472b6"/><text x="754" y="211" fill="#f1f5f9">branch 分支</text>
  </g>
  <text x="754" y="239" fill="#94a3b8" font-size="12.5">须覆盖对应</text>
  <text x="754" y="259" fill="#94a3b8" font-size="12.5">分支条件</text>

  <!-- 底栏 -->
  <rect x="0" y="340" width="900" height="43" fill="#0a0e18"/>
  <text x="42" y="367" fill="#64748b" font-size="12.5">browser-test-planner.md Step 2.5 · 逐项 evidence 核验 · display/nav 豁免不是空白通行证</text>
  <text x="858" y="367" fill="#22d3ee" font-size="12.5" text-anchor="end">multi-agent-team</text>
</svg>
