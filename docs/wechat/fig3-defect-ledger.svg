<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#818cf8" flood-opacity="0.25"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>
  <circle cx="850" cy="330" r="130" fill="#818cf8" opacity="0.06"/>
  <text x="42" y="46" fill="#818cf8" font-size="12" letter-spacing="3" font-weight="600">TRAE MULTI-AGENT SKILL · v2.14 特性 3/5</text>
  <text x="42" y="92" fill="#f1f5f9" font-size="30" font-weight="700">跨 run 缺陷台账 defects.json</text>
  <text x="42" y="121" fill="#94a3b8" font-size="14">"疑似缺陷"不再是口头标记 —— 信号→工单→修复→回归，每一步留痕</text>

  <!-- 状态机 -->
  <g filter="url(#sh)">
    <rect x="60" y="185" width="150" height="56" rx="28" fill="#1c2740" stroke="#fbbf24" stroke-width="2"/>
    <rect x="330" y="185" width="150" height="56" rx="28" fill="#1c2740" stroke="#38bdf8" stroke-width="2"/>
    <rect x="620" y="185" width="150" height="56" rx="28" fill="#1c2740" stroke="#34d399" stroke-width="2"/>
    <rect x="330" y="278" width="150" height="52" rx="26" fill="#1c2740" stroke="#f472b6" stroke-width="2"/>
  </g>
  <g font-size="17" font-weight="700" text-anchor="middle">
    <text x="135" y="213" fill="#fbbf24">open</text>
    <text x="405" y="213" fill="#38bdf8">fixed</text>
    <text x="695" y="213" fill="#34d399">closed</text>
    <text x="405" y="303" fill="#f472b6">regressed</text>
  </g>
  <g font-size="10.5" text-anchor="middle" fill="#64748b">
    <text x="135" y="230">DEF-001 · bug_ref 强制</text>
    <text x="405" y="230">fix.commit 已登记</text>
    <text x="695" y="230">回归 run 全 PASS</text>
    <text x="405" y="320">回归再犯 · audit 汇总</text>
  </g>
  <!-- 转移箭头 -->
  <line x1="212" y1="205" x2="326" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="269" y="196" fill="#94a3b8" font-size="11" text-anchor="middle">update --commit</text>
  <line x1="212" y1="223" x2="326" y2="223" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="269" y="241" fill="#64748b" font-size="10.5" text-anchor="middle">误报: close --reason</text>
  <line x1="482" y1="205" x2="616" y2="205" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="549" y="196" fill="#94a3b8" font-size="11" text-anchor="middle">close --regression-run</text>
  <text x="549" y="240" fill="#64748b" font-size="10.5" text-anchor="middle">关联用例全 PASS 才放行</text>
  <path d="M 720 245 Q 700 290 484 300" fill="none" stroke="#f472b6" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="640" y="282" fill="#f472b6" font-size="11">再犯</text>
  <path d="M 380 278 Q 250 265 150 245" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="235" y="290" fill="#94a3b8" font-size="11">reopen --reason（强制）</text>
  <path d="M 430 274 Q 460 250 478 243" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- 底栏 -->
  <rect x="0" y="340" width="900" height="43" fill="#0a0e18"/>
  <text x="42" y="367" fill="#64748b" font-size="12.5">error --suspected-bug 发信号 · defect add/update/close/reopen/audit/list · 全转移写 history · DEF ID 防复用</text>
  <text x="858" y="367" fill="#818cf8" font-size="12.5" text-anchor="end">multi-agent-team</text>
</svg>
