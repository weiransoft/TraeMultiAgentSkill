name: multi-agent-team
version: 2.14.0
description: |
  Trae 多智能体协作技能（AI 增强版 + 长程 Agent 支持 + Karpathy 原则 + Cybernetics 工程控制论 + Ponytail 决策梯 + Autonomous 自主编排 + UI/UX 巡检与视觉回归 + SU 既有系统理解 + SFD 专家详说 + v2.10 方案撰写全流程 + v2.11 业务动线分析与页面设计闭环 + v2.12 浏览器端页面功能与视觉测试闭环 + v2.13 数据校验闭环 + v2.14 功能覆盖驱动测试与缺陷台账）
  
  基于双层动态上下文管理架构和大模型 AI 助手能力，实现智能体之间的高效协作。
  支持产品、架构、开发、测试等多种角色的智能调度和工作流编排。
  
  核心特性：
  - v2.14 功能清单驱动：page-feature-inventory.json 每页功能项（FUNC-*，kind=interactive/form/display/nav/branch），evidence 强制文件:行号
  - v2.14 覆盖矩阵门禁（feature_gate）：FUNC × 用例关联现算覆盖，interactive/form 任一未覆盖 → 整体 FAIL；清单 SHA256 锚定防篡改
  - v2.14 缺陷台账（defects.json 跨 run 全局）：信号(error --suspected-bug)→工单(defect add)→修复(--commit)→回归 run 核对→close/reopen 状态机
  - v2.14 缺陷登记闸：suspected_bug 信号未登记 DEF-* 工单 → finalize gate=FAIL，杜绝漏登
  - v2.13 数据校验闭环：DC 数据契约（表单→API→DB→回读全链路映射）→ DB 前后快照 → 行级 diff 对照 → DR 业务规则求值 → data_gate 数据门禁
  - v2.13 五类业务数据规则：唯一性(UNIQ) / 不变式(INV) / 守恒(CONS) / 状态机(SM) / 引用完整(REF)
  - v2.13 严格一致性测试：测试数据集（DT-*）× DB 落库预期（db_expectation）× 快照 diff 逐项吻合，禁止人工口算数据结论
  - v2.13 确定性内核 scripts/data_test/：data_rules.py（受限表达式求值器 + 行级快照 diff）+ db_probe.py（只读快照引擎，复用 su/db_guard ReadOnlyGuard）
  - v2.13 记录器扩展：browser_test_recorder.py 新增 db-snapshot / dc-check / rule 子命令 + --db-config 连接配置 + 数据门禁（声明必执行，禁止静默跳过）
  - v2.12 浏览器测试闭环：操作点细化→六类数据测试集→用例四角色评审→三宿主浏览器执行→步骤级全程记录
  - v2.12 三宿主支持：agent-browser / Trae 内置浏览器 / Chrome DevTools MCP（auto 模式按序自动降级）
  - v2.12 六类数据测试集：正向(P) / 边界(B) / 非法(N) / 空(E) / 权限(A) / 时序(T)
  - v2.12 确定性记录器 browser_test_recorder.py：schema 强制校验 + finalize 一致性核对 + P0 通过率门禁
  - v2.11 业务动线分析与页面设计闭环：SU 页面发现→断点检测→漏洞扫描→缺失页面设计→proposal-review 评审→开发→UI/UX 视觉测试
  - v2.11 5 类逻辑断点检测：入口断裂(BREAK-1) / 出口断裂(BREAK-2) / 前置条件缺失(BREAK-3) / 数据衔接断裂(BREAK-4) / 业务闭环断裂(BREAK-5)
  - v2.11 5 类业务线漏洞扫描：数据泄漏(VULN-1) / 状态不一致(VULN-2) / 操作不可达(VULN-3) / 边界缺失(VULN-4) / 导航不一致(VULN-5)
  - v2.11 缺失页面详细设计模板：GAP-DESIGN 9 段式结构（页面目标→用户旅程→信息架构→交互流程→数据模型→路由守卫→衔接点→改动评估→验收标准）
  - v2.10 方案撰写全流程：业界调研→方案撰写→4 角色交叉评审→共识收敛→闭环修改
  - v2.10 业界最佳实践真实调研：WebSearch + 浏览器插件真实执行，拒绝凭空生成
  - v2.10 多角色方案交叉评审：架构师/产品经理/测试专家/独立开发者 4 视角评审，强制结合项目最新代码
  - Karpathy 四大核心原则强制执行（Think Before Coding / Simplicity First / Surgical Changes / Goal-Driven）
  - Ponytail 决策梯：6 步决策梯 + 16 条不可简化红线，少写多余代码
  - Cybernetics 工程控制论增强：三环控制模型 + 反馈控制环 + 性能画像 + 守护协调器
  - Autonomous Mode 自主编排：plan→dev→verify→fix 4 阶段循环
  - Dynamic Workflows 6 大动态工作流模式
  - 插件热加载 V3 架构
  - UI/UX 巡检分析与视觉回归测试脚本（v2.7）
  - 多角色代码走读与 3D 代码地图可视化
  - 双层动态上下文管理（长期记忆 + 工作记忆）
  - AI 语义理解驱动的智能角色匹配
  - 灵活的工作流编排引擎
  - 完整的技能注册和发现机制
  - 经验沉淀和知识积累
  - 大模型 AI 助手深度集成
  - 长程 Agent 支持（Checkpoint + Handoff + TaskList）
  - Claude Code SubAgent 平台适配
  - 既有系统反向理解（SU：黑盒 Web 系统只读采集 + 10 节理解文档，v2.9）

author: Trae Team
status: active
ai_enhanced: true
# v2.8.1 诚实标注：AI 能力分层说明
# - 提示词层 AI：由宿主 LLM（Trae/Claude）直接执行语义理解、角色匹配、共识决策
# - 脚本层确定性：Python 工具提供代码扫描、UI 检测、视觉回归、TFIDF/Hashing 相似度
# - 降级模式：无网络/模型时脚本自动降级到本地算法；Claude Code SubAgent 无真实命令时返回错误
ai_capability_note: |
  本技能的"AI 智能"由宿主大模型在提示词层完成，脚本层仅提供确定性工具。
  角色匹配的语义理解依赖宿主 LLM；脚本中的 TFIDF/Hashing 为本地降级实现。
  Claude Code 侧 SubAgent 调用在无真实命令时返回错误（fallback_mode: error），
  真实并行子代理由宿主 Task 机制实现。
ai_capabilities:
  semantic_matching: true        # 宿主 LLM 提示词层
  intelligent_reasoning: true    # 宿主 LLM 提示词层
  context_understanding: true    # 宿主 LLM 提示词层
  natural_language_interface: true # 宿主 LLM 提示词层
  long_running_agent: true       # 脚本层（Checkpoint + Handoff）
  karpathy_principle_enforcement: true # 脚本层（规则检查）
  cross_platform_adaptation: true # 脚本层（平台检测 + 适配器）
  cybernetics_feedback_control: true # 脚本层（控制环逻辑）
  autonomous_orchestration: true # 脚本层（4 阶段循环）
  dynamic_workflow_patterns: true # 脚本层（6 大模式执行器）
  plugin_hot_reload: true        # 脚本层（V3 架构）
  uiux_audit: true               # 脚本层（确定性检测）
  visual_regression: true        # 脚本层（像素级对比）
  tfidf_similarity: true         # 脚本层（本地降级算法）
  hashing_similarity: true       # 脚本层（本地降级算法）
  v2_10_industry_research: true  # 宿主 LLM 提示词层（WebSearch + 浏览器插件真实调研）
  v2_10_proposal_review: true    # 宿主 LLM 提示词层（多角色交叉评审 + 共识收敛）
  v2_11_business_flow_analysis: true # 宿主 LLM 提示词层（5 类断点检测 + 5 类漏洞扫描）
  v2_11_page_gap_design: true    # 宿主 LLM 提示词层（GAP-DESIGN 9 段式详细设计模板）
  v2_12_browser_test_planning: true  # 宿主 LLM 提示词层（操作点细化 + 六类数据测试集 + 用例规划）
  v2_12_browser_test_execution: true # 宿主 LLM 提示词层（三宿主执行 + 步骤级记录 + 阻碍闭环）
  v2_12_test_recorder: true      # 脚本层（记录器 schema 校验 + 一致性核对 + 门禁）
  v2_14_feature_inventory: true    # 宿主 LLM 提示词层（FUNC-* 每页功能清单 + 覆盖完备性设计）
  v2_14_coverage_gate: true        # 脚本层（finalize 现算覆盖矩阵 + feature_gate + SHA256 锚定）
  v2_14_defect_ledger: true        # 脚本层（defect 子命令状态机 + 登记闸 + 回归 close 核对）
  v2_13_data_contract_planning: true # 宿主 LLM 提示词层（DC 数据契约 + db_expectation 设计）
  v2_13_snapshot_diff: true        # 脚本层（data_rules.py 行级快照 diff + DC 预期匹配）
  v2_13_rule_engine: true          # 脚本层（data_rules.py 五类规则 + 受限表达式求值）
  v2_13_readonly_db_probe: true    # 脚本层（db_probe.py 只读快照，复用 su ReadOnlyGuard）
  v2_13_data_gate: true            # 脚本层（dc-check/rule 断言 + data_gate 数据门禁）

capabilities:
  - name: product-manager
    description: |
      产品经理角色，负责需求分析和 PRD 编写
      
      核心能力：
      - 需求挖掘和分析
      - PRD 文档编写
      - 用户研究
      - 竞品分析
      - 产品规划
    input_schema:
      type: object
      properties:
        requirements:
          type: string
          description: 需求描述
        detail_level:
          type: string
          enum: [low, medium, high]
          description: 详细程度
        user_personas:
          type: array
          items:
            type: string
          description: 用户画像列表
    output_schema:
      type: object
      properties:
        prd:
          type: object
          description: PRD 文档
        user_stories:
          type: array
          items:
            type: string
          description: 用户故事列表
        acceptance_criteria:
          type: array
          items:
            type: string
          description: 验收标准

  - name: architect
    description: |
      架构师角色，负责系统架构设计和技术选型
      
      核心能力：
      - 系统架构设计
      - 技术选型和评估
      - 架构评审
      - 性能优化设计
      - 安全架构设计
    input_schema:
      type: object
      properties:
        requirements:
          type: object
          description: 需求文档（PRD）
        constraints:
          type: array
          items:
            type: string
          description: 技术约束
        scalability_requirements:
          type: string
          description: 可扩展性要求
    output_schema:
      type: object
      properties:
        architecture:
          type: object
          description: 架构设计文档
        technology_stack:
          type: array
          items:
            type: string
          description: 技术栈选择
        component_design:
          type: object
          description: 组件设计

  - name: test-expert
    description: |
      测试工程师角色，负责测试用例设计和执行
      
      核心能力：
      - 测试用例设计
      - 测试执行
      - Bug 跟踪和分析
      - 质量保障
      - 自动化测试
    input_schema:
      type: object
      properties:
        requirements:
          type: object
          description: 需求文档
        code:
          type: string
          description: 待测试代码
        test_strategy:
          type: string
          description: 测试策略
    output_schema:
      type: object
      properties:
        test_cases:
          type: array
          items:
            type: object
          description: 测试用例
        test_results:
          type: array
          items:
            type: object
          description: 测试结果
        bug_reports:
          type: array
          items:
            type: object
          description: Bug 报告

  - name: solo-coder
    description: |
      独立开发者角色，负责代码实现和功能开发

      核心能力：
      - 代码实现
      - 功能开发
      - 代码优化
      - Bug 修复
      - 单元测试编写
    input_schema:
      type: object
      properties:
        design:
          type: object
          description: 设计文档
        requirements:
          type: object
          description: 需求文档
        coding_standards:
          type: object
          description: 编码规范
    output_schema:
      type: object
      properties:
        code:
          type: string
          description: 源代码
        unit_tests:
          type: array
          items:
            type: string
          description: 单元测试代码
        documentation:
          type: string
          description: 代码文档

  - name: ui-designer
    description: |
      UI 设计师角色，负责用户界面设计
      
      核心能力：
      - 界面设计
      - 交互设计
      - 视觉设计
      - 原型设计
      - 设计系统建设
    input_schema:
      type: object
      properties:
        requirements:
          type: object
          description: 需求文档
        brand_guidelines:
          type: object
          description: 品牌规范
        user_flows:
          type: array
          items:
            type: string
          description: 用户流程
    output_schema:
      type: object
      properties:
        designs:
          type: array
          items:
            type: object
          description: 设计稿
        prototypes:
          type: array
          items:
            type: string
          description: 原型
        design_system:
          type: object
          description: 设计系统组件

  - name: ai-assistant
    description: |
      AI 助手角色，提供大模型语义理解和智能推理能力
      
      核心能力：
      - 语义理解和匹配
      - 智能推理和决策
      - 上下文感知
      - 自然语言交互
      - 知识问答
      - 代码审查和建议
    input_schema:
      type: object
      properties:
        task:
          type: string
          description: 任务描述
        context:
          type: object
          description: 上下文信息
        mode:
          type: string
          enum: [matching, reasoning, reviewing, assisting]
          description: AI 工作模式
    output_schema:
      type: object
      properties:
        response:
          type: string
          description: AI 响应
        confidence:
          type: number
          description: 置信度
        reasoning:
          type: string
          description: 推理过程
        suggestions:
          type: array
          items:
            type: string
          description: 建议列表

  - name: system_understanding
    description: |
      既有系统反向理解（SU）能力：黑盒 Web 系统反向理解

      核心能力：
      - Playwright 自动登录（会话维持、重登、storage_state 验证码/2FA 旁路）
      - 图式 BFS 页面遍历（url_key 去重、动作分级 T1/T2/T3、破坏性请求网络级拦截）
      - DB/Redis 只读内省（MySQL/PostgreSQL SELECT-only 白名单、Redis 只读命令白名单）
      - UI↔API↔表↔Redis 三角关联分析（确定性证据 + 隐式外键推断）
      - 10 节《系统功能理解文档》渲染 + 宿主 LLM 两阶段语义回填工作流
      - 专家详说（SFD，v2.9.1）：--detailed-doc 前置校验（锚定 run_id、findings 双源一致）→
        五视角素材包 + 8 节大纲骨架 → 宿主 LLM 派发五专家（su-detailed-*.md）→
        --assemble 装配 SYSTEM_FUNCTION_DOC.md + assembly-report.json（零网络零凭据零新依赖）

      安全红线：凭据不落盘明文（统一 redact 管线）；DB/Redis 严格只读；
      浏览器网络层拦截全部非 GET 与白名单外域；危险按钮零点击。

    input_schema:
      type: object
      description: 凭据配置 JSON（system 必填，database/redis 可选，缺失透镜自动跳过并登记）
      properties:
        system:
          type: object
          description: 目标系统凭据（base_url/login_url/username/password/login_selectors/success_hint）
        database:
          type: object
          description: MySQL/PostgreSQL 只读连接配置（engine/host/port/user/password/database/schemas，可选）
        redis:
          type: object
          description: Redis 只读采集配置（host/port/password/db/key_allowlist，可选）
    output_schema:
      type: object
      description: 输出产物（docs/system-understanding/<system_id>/ 目录）
      properties:
        understanding_md:
          type: string
          description: UNDERSTANDING.md《系统功能理解文档》主文档（固定 10 节）
        understanding_json:
          type: string
          description: understanding.json 结构化全量结果（机读、脱敏后，供宿主 LLM 消费）
        diagrams:
          type: array
          items:
            type: string
          description: diagrams/ 目录 Mermaid 图源（navigation.mmd 导航图、er.mmd ER 图）
        system_function_doc_md:
          type: string
          description: SYSTEM_FUNCTION_DOC.md《系统功能详说文档》终稿（SFD --assemble 产物，v2.9.1）
        assembly_report_json:
          type: string
          description: assembly-report.json 装配报告（引用校验、锚点漂移检测、凭据扫描结果，v2.9.1）

  - name: industry_research
    description: |
      v2.10 业界最佳实践调研能力：真实执行业界调研

      核心能力：
      - WebSearch 多路并行搜索（中英文查询变体 + site: 限定权威来源）
      - 浏览器插件深度阅读（访问完整页面 + 提取关键架构描述和代码片段）
      - 信息交叉验证（至少 2-3 个独立来源确认同一结论）
      - 主流方案对比矩阵（方案/框架对比维度：适用场景、优势、劣势、生产验证、社区活跃度）
      - 与当前项目的对比分析（现有技术栈、约束条件、适配路径、风险评估）
      - 推荐决策（推荐方案 + 备选方案 + 避坑清单）

      强制约束：所有结论必须有真实来源支撑（URL 可追溯）；优先近 2 年内容；禁止凭空生成。

    input_schema:
      type: object
      properties:
        research_topic:
          type: string
          description: 调研主题（如 "实时协作编辑架构"）
        project_context:
          type: object
          description: 当前项目上下文（技术栈、现有架构、约束条件）
          properties:
            tech_stack:
              type: array
              items:
                type: string
            existing_architecture:
              type: string
            constraints:
              type: array
              items:
                type: string
        depth:
          type: string
          enum: [quick, standard, deep]
          default: standard
          description: 调研深度（quick=5-8 来源 / standard=10-15 / deep=20+）
    output_schema:
      type: object
      properties:
        report_path:
          type: string
          description: 调研报告文件路径（docs/proposals/{task-id}/industry-research.md）
        source_count:
          type: integer
          description: 信息来源总数
        recommendation:
          type: object
          description: 推荐决策
          properties:
            primary:
              type: string
            alternatives:
              type: array
              items:
                type: string
            pitfalls:
              type: array
              items:
                type: string
        comparison_matrix:
          type: array
          items:
            type: object
            description: 方案对比矩阵

  - name: proposal_review
    description: |
      v2.10 多角色方案交叉评审能力

      核心能力：
      - 4 角色独立评审（架构师/产品经理/测试专家/独立开发者）
      - 强制结合项目最新代码（每个评审必须扫描代码并引用具体文件路径/行号）
      - 结构化评审输出（评分 + 🔴阻断性问题 + 🟡建议 + 🟢亮点）
      - 共识收敛机制（≥2 角色同时提出的问题升级为共识问题）
      - 闭环修改判定（修改后再评审，最多 3 轮循环）

      Prompt 模板：
      - docs/spec/role-prompts/proposal-architect-review.md
      - docs/spec/role-prompts/proposal-pm-review.md
      - docs/spec/role-prompts/proposal-test-review.md
      - docs/spec/role-prompts/proposal-coder-review.md

    input_schema:
      type: object
      properties:
        proposal_doc:
          type: string
          description: 待评审方案文档路径
        project_root:
          type: string
          description: 项目根目录路径（用于扫描最新代码）
        review_roles:
          type: array
          items:
            type: string
          enum: [architect, product_manager, test_expert, solo_coder]
          default: [architect, product_manager, test_expert, solo_coder]
          description: 参与评审的角色列表
        industry_research:
          type: string
          description: 业界调研报告路径（可选，用于评审时参考）
    output_schema:
      type: object
      properties:
        reviews_path:
          type: string
          description: 评审意见目录（docs/proposals/{task-id}/reviews/）
        consensus_report:
          type: string
          description: 共识收敛报告路径（docs/proposals/{task-id}/consensus-report.md）
        final_proposal:
          type: string
          description: 最终方案文档路径（docs/proposals/{task-id}/proposal-final.md）
        all_passed:
          type: boolean
          description: 是否所有角色评审通过
        consensus_issues:
          type: array
          items:
            type: string
          description: 共识问题清单
        divergence_points:
          type: array
          items:
            type: string
          description: 分歧点清单

  - name: business_flow_analysis
    description: |
      v2.11 业务动线分析能力：从需求文档出发，结合 SU 页面遍历产物和项目代码，
      系统性地发现页面间流转路径、数据衔接、逻辑断点和业务线漏洞。

      核心能力：
      - 5 类逻辑断点检测：入口断裂(BREAK-1) / 出口断裂(BREAK-2) /
        前置条件缺失(BREAK-3) / 数据衔接断裂(BREAK-4) / 业务闭环断裂(BREAK-5)
      - 5 类业务线漏洞扫描：数据泄漏路径(VULN-1) / 状态不一致(VULN-2) /
        操作不可达(VULN-3) / 边界条件缺失(VULN-4) / 导航不一致(VULN-5)
      - 页面全景盘点：复用 SU understanding.json 的 ui.pages + navigation
      - 流转路径梳理：入口 → 操作 → API → DB → 出口，标注数据传递方式
      - 欠缺页面清单：GAP-001 ~ N，对比需求和实际
      - 强制证据要求：每个分析必须有 SU 采集产物或代码证据

      Prompt 模板：docs/spec/role-prompts/business-flow-analysis.md

    input_schema:
      type: object
      properties:
        requirements_doc:
          type: string
          description: 需求文档路径（PRD/SPEC/README）
        su_understanding_json:
          type: string
          description: SU 产物 understanding.json 路径（可选，优先复用）
        project_root:
          type: string
          description: 项目根目录
        break_categories:
          type: array
          items:
            type: string
            enum: [BREAK-1, BREAK-2, BREAK-3, BREAK-4, BREAK-5]
          default: [BREAK-1, BREAK-2, BREAK-3, BREAK-4, BREAK-5]
        vuln_categories:
          type: array
          items:
            type: string
            enum: [VULN-1, VULN-2, VULN-3, VULN-4, VULN-5]
          default: [VULN-1, VULN-2, VULN-3, VULN-4, VULN-5]
    output_schema:
      type: object
      properties:
        report_path:
          type: string
          description: 业务动线分析报告路径
        page_inventory:
          type: string
          description: 页面盘点清单 JSON 路径
        breaks:
          type: string
          description: 断点清单 JSON 路径
        vulns:
          type: string
          description: 漏洞清单 JSON 路径
        gaps:
          type: string
          description: 欠缺页面清单 JSON 路径
        break_count:
          type: integer
          description: 断点数量（含 critical 数量）
        vuln_count:
          type: integer
          description: 漏洞数量（含 P0 数量）
        gap_count:
          type: integer
          description: 欠缺页面数量

  - name: page_gap_design
    description: |
      v2.11 缺失页面详细设计能力：针对业务动线分析发现的断点/漏洞，
      输出与现有系统无缝衔接的页面详细设计。

      核心能力：
      - GAP-DESIGN 9 段式模板：页面目标→用户旅程→信息架构→交互流程→
        数据模型→路由守卫→衔接点→改动评估→验收标准
      - 与现有页面衔接点强制要求：入口/出口/组件复用精准到代码位置
      - 改动范围精确评估：新增文件数/修改文件数/行数/风险等级
      - Karpathy + Ponytail 约束：优先复用，能用对话框解决不新建页面

      Prompt 模板：docs/spec/role-prompts/page-gap-design.md

    input_schema:
      type: object
      properties:
        analysis_report:
          type: string
          description: 业务动线分析报告路径（business_flow_analysis 产物）
        project_root:
          type: string
          description: 项目根目录
        gap_ids:
          type: array
          items:
            type: string
          description: 要设计的 GAP 编号列表（如 ["GAP-001", "BREAK-003"]）
        min_priority:
          type: string
          enum: [P0, P1, P2, P3]
          default: P0
          description: 最低设计优先级（只设计 ≥ 此优先级的 GAP）
    output_schema:
      type: object
      properties:
        design_doc:
          type: string
          description: 缺失页面详细设计文档路径
        reuse_checklist:
          type: array
          items:
            type: object
          description: 复用清单（组件/API/类型复用项）
        change_checklist:
          type: array
          items:
            type: object
          description: 改动清单（新增/修改的文件列表 + 行数）
        design_count:
          type: integer
          description: 设计的 GAP 数量
        total_estimated_lines:
          type: integer
          description: 预估新增/修改的总行数

  - name: browser_test_planning
    description: |
      v2.12 浏览器测试规划能力：从前后端代码与文档出发（可复用 v2.11 动线分析结果），
      细化到页面操作点级别，产出六类数据测试集与完整浏览器测试用例。

      核心能力：
      - 操作点细化（OP-*）：一次用户可感知动作 + 代码位置证据 + 可断言预期结果
      - 六类数据测试集（DT-*）：正向(P)/边界(B)/非法(N)/空(E)/权限(A)/时序(T)
      - 测试用例（TC-*）：P0 冒烟/P1 核心/P2 扩展，关联 FLOW/OP/DT 三类 ID
      - 执行序规划：依赖排序 + 三宿主分派 + 破坏性用例回滚方案
      - 可复用 v2.11 业务动线分析结果（FLOW-*/PAGE-* 清单增量校验）

      Prompt 模板：docs/spec/role-prompts/browser-test-planner.md

    input_schema:
      type: object
      properties:
        project_root:
          type: string
          description: 项目根目录（扫描前后端代码）
        requirements_doc:
          type: string
          description: 需求/PRD 文档路径（可选）
        reuse_flow_analysis:
          type: string
          description: v2.11 业务动线分析报告路径（可选，复用 FLOW/OP 清单）
        su_understanding_json:
          type: string
          description: SU 产物 understanding.json 路径（可选，页面清单数据源）
    output_schema:
      type: object
      properties:
        test_plan:
          type: string
          description: test-plan.md 路径（功能-页面对照表 + OP-* 操作点清单）
        test_datasets:
          type: string
          description: test-datasets.json 路径（六类数据测试集）
        test_cases:
          type: string
          description: test-cases.json 路径（TC-* 用例）
        execution_plan:
          type: string
          description: test-execution-plan.json 路径（执行序 + 宿主分派 + 破坏性标注）
        op_count:
          type: integer
          description: 操作点数量
        dataset_count:
          type: integer
          description: 数据测试组数量
        case_count:
          type: integer
          description: 测试用例数量（P0/P1/P2 分布）

  - name: browser_test_execution
    description: |
      v2.12 浏览器测试执行能力：按评审通过的执行计划，在三类浏览器宿主中逐一执行
      测试用例，每一步操作、每一个断言、每一条页面/后台错误全部留痕。

      核心能力：
      - 三宿主：agent-browser / Trae 内置浏览器 / Chrome DevTools MCP
        （auto 降级顺序：agent-browser → chrome-devtools → trae-internal）
      - 步骤级记录：recorder step/assert/error/shot（schema 强制校验）
      - 错误双通道采集：console（页面）+ network（后台）+ 疑似缺陷标记
      - 阻碍协议（六类，先解决再推进）：选择器失效/数据缺失/环境故障/
        宿主故障/用例设计错误/疑似产品缺陷
      - finalize 一致性校验：summary 数字必须与逐条 case 文件吻合
      - P0 通过率门禁：P0 失败或阻断 → 整体 gate=FAIL

      Prompt 模板：docs/spec/role-prompts/browser-test-execution.md
      评审模板：docs/spec/role-prompts/browser-test-review.md（Phase 2 四角色评审）
      确定性工具：scripts/browser_test_recorder.py

    input_schema:
      type: object
      properties:
        test_plan_dir:
          type: string
          description: 测试计划四件套目录
        target_url:
          type: string
          description: 被测系统 URL
        browser_hosts:
          type: array
          items:
            type: string
            enum: [agent-browser, trae-internal, chrome-devtools, auto]
          default: [auto]
          description: 浏览器宿主清单（auto 按序降级）
    output_schema:
      type: object
      properties:
        run_dir:
          type: string
          description: browser-test-runs/{run_id}/ 运行产物目录
        summary_json:
          type: string
          description: summary.json 路径（机器读汇总）
        summary_md:
          type: string
          description: summary.md 路径（人读报告）
        gate:
          type: string
          enum: [PASS, FAIL]
          description: 门禁结果（P0 通过率 100% 且无 fail/blocked 才 PASS）
        suspected_bugs:
          type: array
          items:
            type: object
          description: 疑似产品缺陷清单（复现步骤+错误+代码位置）

  - name: feature_coverage_and_defect_ledger
    description: |
      v2.14 功能覆盖驱动测试与缺陷台账能力：在 v2.12 浏览器测试闭环与 v2.13
      数据校验闭环之上，以每页功能清单为分母做覆盖门禁，并以跨 run 缺陷台账
      把"疑似缺陷"变成有状态、有回归证据的正式工单。

      核心能力：
      - FUNC-* 每页功能清单：kind=interactive/form/display/nav/branch 五类，
        evidence 强制 `文件:行号`；interactive/form 禁止豁免，display/nav 豁免
        须书面 waive_reason
      - 覆盖矩阵（feature_gate）：finalize 现算 FUNC × PASS 断言关联矩阵；
        interactive/form 任一未覆盖 → 整体 FAIL；清单原件 SHA256 锚定，
        执行期篡改即 FAIL
      - 缺陷台账（defects.json，跨 run 全局）：error --suspected-bug 是执行期
        信号；defect add 是正式工单（bug_ref 强制关联信号 error_seq）；
        状态机 open→fixed（update --commit 登记修复）→closed（回归 run
        关联用例全 PASS 才允许）；closed→regressed→open（reopen 带 reason）
      - 缺陷登记闸：台账启用后，suspected_bug 信号漏登工单 → finalize FAIL
      - DEF-NNN 工单号：扫描台账条目 + history add 记录，防已删条目 ID 复用

      记录器扩展：scripts/browser_test_recorder.py（defect 子命令：add/update/
                 close/reopen/audit/list + run --feature-inventory +
                 case/step --funcs 归因 + finalize feature_gate）
    input_schema:
      type: object
      properties:
        feature_inventory:
          type: string
          description: page-feature-inventory.json 路径（FUNC-* 每页功能清单）
        funcs:
          type: string
          description: 逗号分隔 FUNC-* ID（case/step 关联功能项归因）
        defect_action:
          type: string
          enum: [add, update, close, reopen, audit, list]
          description: 缺陷台账操作
        defect_id:
          type: string
          description: DEF-NNN 工单号（update/close/reopen 必填）
        commit:
          type: string
          description: 修复 commit（update 带 --commit 即 open|regressed→fixed）
    output_schema:
      type: object
      properties:
        feature_gate:
          type: string
          enum: [PASS, FAIL]
          description: 功能覆盖门禁（interactive/form 全覆盖 + 清单未篡改才 PASS）
        feature_coverage:
          type: object
          description: 覆盖矩阵摘要（total/covered/waived/missing 清单）
        defects:
          type: object
          description: 台账摘要（by_status 计数 + open/fixed/regressed 明细）
        defect_gate:
          type: string
          enum: [PASS, FAIL]
          description: 缺陷登记闸（suspected_bug 信号全部有工单才 PASS）

  - name: data_consistency_verification
    description: |
      v2.13 数据校验闭环能力：在 v2.12 浏览器测试闭环之上，对页面输入输出与
      DB 落库数据做严格一致性校验，深入业务流程验证测试数据集与 DB 预期逐项吻合。

      核心能力：
      - DC-* 数据契约：表单字段→API 字段→DB 列→回读展示 全链路映射，
        transform 显式声明且带代码证据（未声明变换一律视为不一致）
      - DR-* 五类业务数据规则：唯一性(UNIQ) / 不变式(INV) / 守恒(CONS) /
        状态机(SM) / 引用完整(REF)；受限表达式求值器（白名单文法，非 eval）
      - DB 前后快照：db_probe.py 只读引擎（复用 su/db_guard ReadOnlyGuard，
        仅 SELECT/SHOW/EXPLAIN；连接级只读加固；失败诚实降级 env_failure）
      - 行级快照 diff：主键对齐的 added/removed/changed + 列级新旧值 + 聚合对照
      - 数据门禁（data_gate）：声明的 DB 校验必须执行（缺失即拒绝收尾）、
        断言失败计入 P0 门禁、dc_fail/rule_fail>0 → 整体 gate=FAIL

      确定性内核：scripts/data_test/data_rules.py（diff + 规则求值）
                 scripts/data_test/db_probe.py（只读快照引擎）
      记录器扩展：scripts/browser_test_recorder.py（db-snapshot / dc-check / rule
                 + run --db-config + case --db-check-before/after/--dcs）
      设计文档：docs/dev/DATA_CONSISTENCY_TESTING.md

    input_schema:
      type: object
      properties:
        db_config:
          type: string
          description: DB 连接配置 JSON（engine=sqlite/mysql/postgres + 连接参数）
        data_contracts:
          type: string
          description: test-data-contracts.json 路径（DC-* 数据契约清单）
        data_rules:
          type: string
          description: data-rules.json 路径（DR-* 业务数据规则声明）
        db_checks:
          type: string
          description: db-checks.json 路径（只读快照查询清单，参数化占位符）
    output_schema:
      type: object
      properties:
        data_gate:
          type: string
          enum: [PASS, FAIL]
          description: 数据门禁（dc/rule 断言全过 + 声明校验零缺失才 PASS）
        dc_total:
          type: integer
          description: DC 契约校验执行数
        dc_pass:
          type: integer
          description: DC 契约校验通过数
        rules_total:
          type: integer
          description: DR 规则求值执行数
        rules_pass:
          type: integer
          description: DR 规则求值通过数

dependencies: []

ai_integration:
  enabled: true
  provider: trae_ai_assistant
  features:
    - semantic_matching
    - intelligent_reasoning
    - context_understanding
    - natural_language_processing
    - code_analysis
  config:
    max_tokens: null          # null = 不限制（默认）；正整数 = 显式上限
    temperature: 0.7
    top_p: 0.9
    use_cache: true
    fallback_to_keyword: true

workflows:
  - workflow_id: standard-dev-workflow
    name: 标准开发工作流
    description: 产品 → 架构 → 开发 → 测试的完整流程
    steps:
      - step_id: prd
        name: 需求分析
        role: product-manager
        action: analyze_requirements

      - step_id: architecture
        name: 架构设计
        role: architect
        action: design_architecture

      - step_id: development
        name: 代码开发
        role: solo-coder
        action: implement_code

      - step_id: testing
        name: 测试验证
        role: test-expert
        action: execute_tests

  - workflow_id: rapid-prototype-workflow
    name: 快速原型工作流
    description: 快速验证想法的简化流程
    steps:
      - step_id: quick-design
        name: 快速设计
        role: solo-coder
        action: rapid_implementation

  - workflow_id: bug-fix-workflow
    name: Bug 修复工作流
    description: Bug 分析和修复流程
    steps:
      - step_id: analysis
        name: Bug 分析
        role: test-expert
        action: analyze_bug

      - step_id: fix
        name: Bug 修复
        role: solo-coder
        action: fix_bug

      - step_id: verification
        name: 验证
        role: test-expert
        action: verify_fix

  - workflow_id: proposal-review-workflow
    name: 方案撰写全流程（v2.10 新增）
    description: |
      业界调研 → 方案撰写 → 4 角色交叉评审 → 共识收敛 → 闭环修改。
      复用 adversarial-verify 动态工作流模式 + WorkflowLoopController 循环机制。
      业界调研由宿主 LLM 配合浏览器插件真实执行（WebSearch + browser_use）。
      所有评审 prompt 强制要求结合项目最新代码。
    version: "2.10"
    steps:
      - step_id: industry-research
        name: 业界调研（真实执行）
        role: industry-researcher
        action: research_best_practices
        description: |
          WebSearch 多路并行搜索 + 浏览器深度阅读 + 信息交叉验证 + 方案对比矩阵 + 项目适配分析。
          所有结论必须有真实来源支撑（禁止凭空生成）。

      - step_id: proposal-writing
        name: 方案撰写（结合调研 + 项目代码）
        role: host_llm
        action: write_proposal
        depends_on: [industry-research]
        description: |
          结合 Phase 0 调研报告 + 扫描项目最新代码，撰写初版方案文档。
          必须定义清晰的验收标准（可量化、可验证）和与现有代码的集成路径。

      - step_id: multi-role-review
        name: 多角色交叉评审（4 角色并行）
        role: [architect, product-manager, test-expert, solo-coder]
        action: review_proposal
        depends_on: [proposal-writing]
        parallel: true
        description: |
          架构师/产品经理/测试专家/独立开发者 4 视角独立评审，
          强制要求扫描项目最新代码并引用具体文件路径/行号。

      - step_id: consensus-convergence
        name: 共识收敛
        role: host_llm
        action: converge_consensus
        depends_on: [multi-role-review]
        description: |
          汇总 4 份评审意见，识别共识点（≥2 角色同时提出）和分歧点。

      - step_id: modify-loop
        name: 根据共识修改 + 闭环判定
        role: host_llm
        action: modify_until_consensus
        depends_on: [consensus-convergence]
        loop_until: all_roles_pass OR max_iterations(3)
        description: |
          根据共识问题清单修改方案，然后回到 multi-role-review 再评审。
          最多 3 轮循环，超过上限则输出当前方案 + 剩余问题清单交由用户裁决。

  - workflow_id: business-flow-analysis-workflow
    name: 业务动线分析与页面设计闭环（v2.11 新增）
    description: |
      SU 页面发现 → 业务动线分析（5 类断点 + 5 类漏洞）→ 缺失页面设计
      → proposal-review 评审 → 开发 → UI/UX 视觉测试。
      复用 SU v2.9 页面遍历、proposal-review v2.10 评审闭环、UI/UX v2.7 测试工具。
    version: "2.11"
    steps:
      - step_id: su-discovery
        name: SU 页面发现（复用 v2.9）
        role: system_understanding
        action: collect_pages_and_nav
        description: |
          复用 SU BFS 页面遍历产出 understanding.json。
          已有产物则跳过，无产物时执行采集。

      - step_id: flow-analysis
        name: 业务动线分析（5 类断点 + 5 类漏洞）
        role: business_flow_analyst
        action: analyze_page_flows
        depends_on: [su-discovery]
        description: |
          5 Step：页面盘点 → 流转梳理 → 5 类断点检测(BREAK-1~5)
          → 5 类漏洞扫描(VULN-1~5) → 欠缺页面清单(GAP-001~N)。
          强制引用 SU 产物 + 代码扫描证据。

      - step_id: gap-design
        name: 缺失页面详细设计（GAP-DESIGN 9 段式）
        role: page_gap_designer
        action: design_missing_pages
        depends_on: [flow-analysis]
        description: |
          每个缺失页面/断点输出 GAP-DESIGN 9 段式详细设计：
          页面目标→用户旅程→信息架构→交互流程→数据模型→路由守卫→
          与现有页面衔接点(强制)→改动范围评估→验收标准。
          优先复用现有组件/API/类型，能用对话框解决不新建页面。

      - step_id: multi-role-review
        name: 多角色交叉评审（复用 v2.10 proposal-review）
        role: [architect, product_manager, test_expert, solo_coder]
        action: review_designs
        depends_on: [gap-design]
        loop_until: all_roles_pass OR max_iterations(3)
        description: |
          4 角色独立评审设计方案，共识收敛（≥2 角色同时提出的问题升级为共识问题）。
          最多 3 轮闭环修改。

      - step_id: execution
        name: 执行开发
        role: solo_coder
        action: implement_designs
        depends_on: [multi-role-review]
        description: |
          独立开发者按 GAP-DESIGN 逐条实现。
          验收标准必须全部通过；新增代码必须有单元测试。

      - step_id: uiux-test
        name: UI/UX 视觉测试（复用 v2.7 工具链）
        role: test_expert
        action: run_uiux_and_visual_test
        depends_on: [execution]
        description: |
          uiux_analyzer.py 巡检（可访问性/交互/布局/UX 反模式 4 大维度）
          + visual_regression.py 像素级视觉回归。

  - workflow_id: browser-test-workflow
    name: 浏览器端页面功能与视觉测试闭环（v2.12 新增，v2.13 数据校验 + v2.14 功能覆盖/缺陷台账增强）
    description: |
      测试规划（操作点+每页功能清单 FUNC+六类数据集+数据契约 DC+用例）→
      测试用例四角色评审 → 三宿主浏览器逐一执行（全程步骤级记录 + --funcs
      归因 + 缺陷登记闭环）→ DB 前后快照与数据对照 →
      汇总门禁（P0 + data_gate + feature_gate + 登记闸）与闭环衔接。
      复用 v2.11 动线分析结果、v2.10 共识收敛机制、v2.7 视觉回归工具。
    version: "2.14"
    steps:
      - step_id: test-planning
        name: 测试规划（操作点 + 六类数据测试集 + 用例）
        role: test_expert
        action: plan_browser_tests
        description: |
          六步：功能流程梳理（复用 v2.11 FLOW/OP 或扫描代码）→ 操作点细化(OP-*)
          → 每页功能清单（v2.14 Step 2.5：FUNC-*，kind 五类 + evidence 文件:行号，
            interactive/form 禁止豁免）
          → 六类数据测试集(DT-P/B/N/E/A/T；v2.13 写操作数据组必带 db_expectation)
          → 数据契约设计（v2.13 Step 3.5：DC-* 全链路字段映射 + DB 预期 + 快照查询；
            Step 3.6：DR-* 五类业务数据规则声明）
          → 测试用例(TC-*，P0 覆盖全部主路径；写操作用例必填 DC-*；
            用例必填 --funcs 关联 FUNC-*，interactive/form 功能项 100% P0 覆盖)
          → 执行序 + 三宿主分派 + 破坏性回滚方案。
          产出八件套: test-plan.md / page-feature-inventory.json /
          test-datasets.json / test-cases.json / test-execution-plan.json /
          test-data-contracts.json / db-checks.json / data-rules.json
          （page-feature-inventory v2.14；后三件 v2.13）。

      - step_id: test-review
        name: 测试用例多角色评审（复用 v2.10 共识收敛）
        role: [test_expert, solo_coder, product_manager, architect]
        action: review_test_plan
        depends_on: [test-planning]
        loop_until: all_roles_pass OR max_iterations(3)
        description: |
          测试专家（一票否决：任一 FLOW 主路径无 P0 覆盖）/ 独立开发者
          （选择器真实性抽查）/ 产品经理（业务真实性）/ 架构师（环境与隔离）。
          v2.13 追加评审项：写操作 OP 无 DC 契约判 BLOCKER；DC 字段映射无代码
          证据判 BLOCKER；db-checks.json 出现非只读语句判 BLOCKER；
          DB 预期凭猜测填写（无 DDL/服务层代码/需求文档出处）判 BLOCKER。
          v2.14 追加评审项：FUNC 清单漏页/漏功能项判 BLOCKER；interactive/form
          功能项无 P0 用例关联判 BLOCKER；豁免无证据或无 waive_reason 判 BLOCKER；
          清单 SHA256 须写入评审记录冻结。
          共识问题清零 + BLOCKER 清零才放行。

      - step_id: browser-execution
        name: 浏览器逐一执行 + 步骤级全程记录
        role: solo_coder
        action: execute_browser_tests
        depends_on: [test-review]
        description: |
          三宿主（agent-browser / Trae 内置浏览器 / Chrome DevTools MCP，
          auto 按序降级）。每用例 recorder start→step/assert/error/shot→end。
          v2.13 数据层：挂 DC 的用例 recorder case --db-check-before/--after 声明
          → db-snapshot --phase before（操作前基线）→ 浏览器动作
          → db-snapshot --phase after → dc-check（行级 diff 对照 DC 预期）
          → rule（DR-* 规则求值）。数据通道严格只读（ReadOnlyGuard）；
          DB 故障数据断言 BLOCKED 不谎报。
          v2.14 功能归因：recorder case/step --funcs 关联 FUNC-* 功能项。
          v2.14 缺陷登记闭环：error --suspected-bug（信号）→ defect add（工单，
          bug_ref 强制关联信号）→ 修复后 defect update --commit（→fixed）→
          回归 run 关联用例全 PASS → defect close；再犯 reopen。
          阻碍协议六类先解决再推进；环境故障即停并报告；
          疑似缺陷不改断言，标记 suspected_bug 并必须登记工单。

      - step_id: finalize-gate
        name: 汇总门禁与闭环衔接
        role: test_expert
        action: finalize_test_run
        depends_on: [browser-execution]
        description: |
          recorder finalize → summary.json + summary.md（一致性校验 +
          P0 通过率 100% 门禁 + v2.13 data_gate 数据门禁：dc/rule 断言失败、
          声明的 DB 校验缺失、env_failure 阻断均计入 FAIL +
          v2.14 feature_gate 功能覆盖门禁：interactive/form 未覆盖 / 清单篡改 /
          suspected_bug 漏登工单 → FAIL）。
          视觉基线 → visual_regression.py（v2.7）；
          疑似 UI/UX 问题 → uiux_analyzer.py（v2.7）；
          新断点回填 v2.11 business-flow 报告 BREAK 清单；
          DC 覆盖率与数据断言通过率写入 summary 数据维度（v2.13）；
          FUNC 覆盖矩阵与缺陷台账状态写入 summary 功能/缺陷维度（v2.14）。

context_management:
  type: dual-layer
  
  global_context:
    description: 全局上下文层（长期记忆）
    components:
      - user_profile: 用户画像
      - knowledge_base: 领域知识库
      - experience_db: 历史经验库
      - collaboration_net: 协作网络
      - capability_models: 能力模型
    
    persistence: true
    version_control: true
  
  task_context:
    description: 任务上下文层（工作记忆）
    components:
      - task_definition: 任务定义
      - task_status: 任务状态
      - working_memory: 工作记忆
      - artifacts: 中间结果
      - thought_history: 思考历史
    
    persistence: true
    cleanup_on_complete: false
  
  synchronization:
    task_to_global:
      - experience_extraction: 提取经验教训
      - knowledge_extraction: 提取新知识
      - preference_update: 更新用户偏好
      - collaboration_record: 记录协作效果
    
    global_to_task:
      - knowledge_injection: 注入相关知识
      - experience_injection: 注入历史经验
      - preference_application: 应用用户偏好
      - capability_reference: 参考能力模型

role_scheduling:
  strategy: intelligent-matching
  
  matcher:
    type: hybrid
    components:
      - keyword_matching: 关键词匹配（权重 0.7）
      - semantic_matching: 语义匹配（权重 0.3）
    
    scoring:
      capability_match: 0.5
      skill_match: 0.3
      keyword_overlap: 0.2
    
    learning:
      enabled: true
      feedback_loop: true

