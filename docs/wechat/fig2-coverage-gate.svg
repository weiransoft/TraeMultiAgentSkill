<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#151d33"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#34d399" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="900" height="383" fill="url(#bg)"/>
  <circle cx="60" cy="340" r="150" fill="#34d399" opacity="0.05"/>
  <text x="42" y="46" fill="#34d399" font-size="12" letter-spacing="3" font-weight="600">TRAE MULTI-AGENT SKILL · v2.14 特性 2/5</text>
  <text x="42" y="92" fill="#f1f5f9" font-size="30" font-weight="700">feature_gate 覆盖矩阵门禁</text>
  <text x="42" y="121" fill="#94a3b8" font-size="14">finalize 从执行记录现算矩阵 —— 不信任任何自报覆盖率</text>

  <!-- 左：覆盖矩阵 -->
  <g filter="url(#sh)">
    <rect x="42" y="150" width="420" height="152" rx="12" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="64" y="180" fill="#e2e8f0" font-size="15" font-weight="600">FUNC × PASS 断言关联矩阵</text>
  <g font-size="13" font-family="Menlo, monospace">
    <text x="70" y="210" fill="#94a3b8">FUNC-01-01 form</text><text x="270" y="210" fill="#34d399" font-weight="700">✓ 覆盖</text>
    <text x="70" y="238" fill="#94a3b8">FUNC-01-02 nav</text><text x="270" y="238" fill="#fbbf24" font-weight="700">◐ 豁免溯源</text>
    <text x="70" y="266" fill="#94a3b8">FUNC-02-01 interactive</text><text x="270" y="266" fill="#f87171" font-weight="700">✗ 缺口</text>
    <text x="70" y="290" fill="#64748b" font-size="11.5">fail 断言不算覆盖 · covered_by 可追溯</text>
  </g>
  <rect x="330" y="250" width="112" height="30" rx="15" fill="#f87171" opacity="0.15"/>
  <text x="345" y="270" fill="#f87171" font-size="13.5" font-weight="700">gate = FAIL</text>

  <!-- 右：SHA256 锚定 -->
  <g filter="url(#sh)">
    <rect x="488" y="150" width="370" height="152" rx="12" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="510" y="180" fill="#e2e8f0" font-size="15" font-weight="600">SHA256 清单锚定 · 防移动球门</text>
  <g font-size="12.5" font-family="Menlo, monospace">
    <text x="510" y="210" fill="#34d399">run 时   sha256(a9f3…7c2e) 落盘</text>
    <text x="510" y="238" fill="#f87171">finalize sha256(41b0…d8a1) ≠</text>
  </g>
  <text x="510" y="268" fill="#f1f5f9" font-size="13.5">执行期偷偷改清单原件 → 直接 FAIL</text>
  <text x="510" y="292" fill="#94a3b8" font-size="12.5">缺口清单含归属页面 + kind，可逐条追查</text>

  <rect x="0" y="340" width="900" height="43" fill="#0a0e18"/>
  <text x="42" y="367" fill="#64748b" font-size="12.5">interactive / form 任一未覆盖 → 整体 gate=FAIL · case/step --funcs 归因 · 引用未知 FUNC 直接拒绝</text>
  <text x="858" y="367" fill="#34d399" font-size="12.5" text-anchor="end">multi-agent-team</text>
</svg>
