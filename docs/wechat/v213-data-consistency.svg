<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#1c1a10"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.2"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="750" height="1000" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="190" fill="#fbbf24" opacity="0.05"/>
  <circle cx="40" cy="960" r="150" fill="#fbbf24" opacity="0.04"/>

  <text x="50" y="78" fill="#fbbf24" font-size="16" letter-spacing="4" font-weight="600">TRAE MULTI-AGENT SKILL · 进化史 4/5 · v2.13</text>
  <text x="50" y="146" fill="#f1f5f9" font-size="42" font-weight="700">数据校验闭环</text>
  <text x="50" y="196" fill="#94a3b8" font-size="21">接口 200、页面弹"成功"——数据真落对库了吗？</text>
  <text x="50" y="228" fill="#94a3b8" font-size="21">UI 绿灯测不到数据库，v2.13 往下扎一层</text>

  <!-- 链路卡 -->
  <g filter="url(#sh)">
    <rect x="50" y="270" width="650" height="230" rx="16" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="80" y="316" fill="#e2e8f0" font-size="22" font-weight="600">DC-* 数据契约：表单→API→DB→回读 全链路映射</text>
  <g font-size="16" font-family="Menlo, monospace">
    <text x="80" y="360" fill="#fbbf24">表单 username ──transform:lowercase──▶ users.name</text>
    <text x="80" y="392" fill="#94a3b8">每字段 evidence: 文件:行号（无证据不许默认"应该一致"）</text>
  </g>
  <g font-size="16" font-family="Menlo, monospace" fill="#7dd3fc">
    <text x="80" y="434">db-snapshot before ──▶ 浏览器动作 ──▶ db-snapshot after</text>
    <text x="80" y="464">dc-check 行级 diff：added / removed / changed 逐列对照</text>
  </g>

  <!-- DR 五类 -->
  <g filter="url(#sh)">
    <rect x="50" y="530" width="650" height="270" rx="16" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="80" y="576" fill="#e2e8f0" font-size="22" font-weight="600">DR-* 五类业务规则（自研解析器求值，非 eval）</text>
  <g font-size="18.5">
    <text x="80" y="618" fill="#fbbf24" font-weight="700">UNIQ 唯一</text><text x="250" y="618" fill="#94a3b8">手机号在 users 表不重复</text>
    <text x="80" y="654" fill="#fbbf24" font-weight="700">INV 不变式</text><text x="250" y="654" fill="#94a3b8">订单金额 = Σ 明细金额</text>
    <text x="80" y="690" fill="#fbbf24" font-weight="700">CONS 守恒</text><text x="250" y="690" fill="#94a3b8">转账前后账户总额不变</text>
    <text x="80" y="726" fill="#fbbf24" font-weight="700">SM 状态机</text><text x="250" y="726" fill="#94a3b8">订单状态只走合法迁移路径</text>
    <text x="80" y="762" fill="#fbbf24" font-weight="700">REF 引用</text><text x="250" y="762" fill="#94a3b8">明细必关联存在的主订单</text>
  </g>

  <rect x="0" y="920" width="750" height="80" fill="#0a0e18"/>
  <text x="50" y="952" fill="#64748b" font-size="16">DB 通道唯一入口 ReadOnlyGuard：只读 SELECT，写 SQL 直接拒绝</text>
  <text x="50" y="980" fill="#64748b" font-size="16">data_gate 数据门禁：数据断言失败 / 声明未校验 → 整体 FAIL，不放行</text>
  <text x="700" y="968" fill="#fbbf24" font-size="16" text-anchor="end">multi-agent-team</text>
</svg>
