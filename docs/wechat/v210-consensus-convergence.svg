<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1000" viewBox="0 0 750 1000" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/><stop offset="1" stop-color="#1b1530"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#818cf8" flood-opacity="0.22"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="750" height="1000" fill="url(#bg)"/>
  <circle cx="700" cy="60" r="190" fill="#818cf8" opacity="0.06"/>
  <circle cx="40" cy="960" r="150" fill="#818cf8" opacity="0.04"/>

  <text x="50" y="78" fill="#818cf8" font-size="16" letter-spacing="4" font-weight="600">TRAE MULTI-AGENT SKILL · 进化史 1/5 · v2.10</text>
  <text x="50" y="146" fill="#f1f5f9" font-size="42" font-weight="700">多角色交叉评审与共识收敛</text>
  <text x="50" y="196" fill="#94a3b8" font-size="21">一个模型评审自己的方案 = 自己给自己发奖状</text>
  <text x="50" y="228" fill="#94a3b8" font-size="21">方案放行前，先过四专家 + 产品经理的五视角交叉评审</text>

  <!-- 评审团 -->
  <g filter="url(#sh)">
    <rect x="50" y="270" width="650" height="210" rx="16" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="80" y="316" fill="#e2e8f0" font-size="22" font-weight="600">五视角评审团（各审各的，互不通气）</text>
  <g font-size="19">
    <text x="80" y="358" fill="#818cf8" font-weight="700">架构师</text><text x="200" y="358" fill="#94a3b8">边界 · 依赖 · 技术债 · 可演进性</text>
    <text x="80" y="394" fill="#818cf8" font-weight="700">独立开发者</text><text x="200" y="394" fill="#94a3b8">可实现性 · 工作量 · 隐藏坑位</text>
    <text x="80" y="430" fill="#818cf8" font-weight="700">测试专家</text><text x="200" y="430" fill="#94a3b8">可测性 · 边界条件 · 一票否决项</text>
    <text x="80" y="466" fill="#818cf8" font-weight="700">产品经理</text><text x="200" y="466" fill="#94a3b8">需求偏差 · 业务价值 · 遗漏场景</text>
  </g>

  <!-- 收敛流程 -->
  <g filter="url(#sh)">
    <rect x="50" y="510" width="650" height="290" rx="16" fill="#1c2740" stroke="#334155"/>
  </g>
  <text x="80" y="556" fill="#e2e8f0" font-size="22" font-weight="600">共识收敛协议</text>
  <g font-size="19" fill="#f1f5f9">
    <text x="80" y="600"><tspan fill="#818cf8" font-weight="700">① 独立评审</tspan>　各角色独立出 BLOCKER / MAJOR / MINOR</text>
    <text x="80" y="642"><tspan fill="#818cf8" font-weight="700">② 分歧交锋</tspan>　意见冲突逐条辩论，理由必须可检验</text>
    <text x="80" y="684"><tspan fill="#818cf8" font-weight="700">③ 共识表</tspan>　　每条问题收敛为 共识 / 异议保留 / 驳回</text>
    <text x="80" y="726"><tspan fill="#818cf8" font-weight="700">④ 放行门禁</tspan>　共识问题清零 + BLOCKER 清零，缺一不放行</text>
  </g>
  <text x="80" y="774" fill="#64748b" font-size="17">评审对象随版本扩展：方案(v2.10) → 测试四件套(v2.12) → DC 契约(v2.13) → FUNC 清单(v2.14)</text>

  <!-- 底栏 -->
  <rect x="0" y="920" width="750" height="80" fill="#0a0e18"/>
  <text x="50" y="952" fill="#64748b" font-size="16">docs/spec/role-prompts/ 角色提示词体系 · proposal-review 全流程</text>
  <text x="50" y="980" fill="#64748b" font-size="16">分歧不掩盖：异议保留也必须记录在案，谁保留、为什么，可追溯</text>
  <text x="700" y="968" fill="#818cf8" font-size="16" text-anchor="end">multi-agent-team</text>
</svg>
